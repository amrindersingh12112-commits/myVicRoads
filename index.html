<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#137a4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RoadMate">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>RoadMate Victoria Demo</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Back">‹</button>
      <div>
        <div class="brand">RoadMate</div>
        <div class="region">Victoria · Demo</div>
      </div>
      <div class="badge">DEMO</div>
    </header>

    <main id="app"></main>

    <nav class="tabbar" aria-label="Main navigation">
      <button class="tab active" data-page="home"><span>⌂</span>Home</button>
      <button class="tab" data-page="vehicles"><span>🚗</span>Vehicles</button>
      <button class="tab" data-page="services"><span>▦</span>Services</button>
      <button class="tab" data-page="profile"><span>◉</span>Profile</button>
    </nav>
  </div>
  <script src="app.js"></script>

</html>
